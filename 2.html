<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Send Compliment Email</title>
    <style type="text/css">
      body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        margin: 0;
        font-family: "Segoe UI", "Roboto", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .form {
        margin: 40px auto;
        display: flex;
        align-items: flex-start;
        flex-direction: column;
        gap: 16px;
        width: 370px;
        background: linear-gradient(135deg, #ffffff 60%, #e3e9f5 100%);
        padding: 28px 34px 32px 34px;
        border-radius: 18px;
        box-shadow: 0 8px 32px 4px rgba(27, 26, 26, 0.15);
        border: 2px solid #b0c4ff;
        position: relative;
      }
      .form .title {
        color: #3c54b4;
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: -1.5px;
        line-height: 38px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        text-shadow: 0 2px 8px #b0c4ff33;
      }
      .form label {
        color: #495179;
        font-size: 1.08rem;
        font-weight: 500;
        margin-bottom: 2px;
        margin-left: 4px;
      }
      .form input {
        outline: 0;
        border: 1.5px solid #c8d6fa;
        background: #f2f6ff;
        padding: 10px 16px;
        border-radius: 8px;
        width: 100%;
        height: 44px;
        font-size: 1rem;
        transition: border 0.2s;
        color: #31416c;
      }
      .form input:focus,
      .form textarea:focus {
        border: 1.5px solid #6b8cff;
        background: #ecf1ff;
      }
      .form textarea {
        border-radius: 8px;
        min-height: 90px;
        max-height: 220px;
        width: 100%;
        resize: vertical;
        outline: 0;
        padding: 10px 16px;
        border: 1.5px solid #c8d6fa;
        background: #f2f6ff;
        font-size: 1rem;
        color: #31416c;
        font-family: inherit;
        transition: border 0.2s;
      }
      .form .btn-row {
        display: flex;
        width: 100%;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 4px;
      }
      .form .generate-btn {
        background: linear-gradient(90deg, #6b8cff 60%, #3c54b4 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 7px 18px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 2px 12px #b0c4ff33;
        transition: background 0.15s, box-shadow 0.2s;
      }
      .form .generate-btn:hover {
        background: linear-gradient(90deg, #3c54b4 60%, #6b8cff 100%);
        box-shadow: 0 4px 20px #b0c4ff55;
        letter-spacing: 0.5px;
      }
      .form .submit-btn {
        background: linear-gradient(90deg, #38cfd9 60%, #3c54b4 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 7px 22px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 12px #38cfd933;
        transition: background 0.18s, box-shadow 0.2s;
      }
      .form .submit-btn:hover {
        background: linear-gradient(90deg, #3c54b4 60%, #38cfd9 100%);
        box-shadow: 0 4px 24px #3c54b455;
        letter-spacing: 0.5px;
      }
      .compliment-loader {
        display: none;
        align-items: center;
        gap: 6px;
        color: #6b8cff;
        font-size: 0.97rem;
        margin-top: 2px;
        margin-bottom: 0;
      }
      .compliment-loader.active {
        display: flex;
      }
      .compliment-loader .dot {
        animation: bounce 1s infinite alternate;
      }
      @keyframes bounce {
        to {
          transform: translateY(-6px);
        }
      }
    </style>
  </head>
  <body>
    <form class="form" action="/send" method="post">
      <div class="title">Send a Compliment!</div>
      <label for="email">Recipient Email</label>
      <input
        type="text"
        placeholder="Recipient email"
        class="input"
        name="email"
        id="email"
        required
      />
      <label for="message">Message</label>
      <textarea
        placeholder="Your message"
        name="message"
        id="message"
        required
      ></textarea>
      <div class="btn-row">
        <button
          type="button"
          class="generate-btn"
          onclick="generateCompliment()"
          id="generateBtn"
        >
          <span id="genBtnText">Generate Compliment</span>
        </button>
        <button class="submit-btn" type="submit">Send Email</button>
      </div>
      <div class="compliment-loader" id="complimentLoader">
        <span>Generating compliment</span>
        <span class="dot">.</span><span class="dot">.</span
        ><span class="dot">.</span>
      </div>
    </form>
    <script>
      function generateCompliment() {
        const btn = document.getElementById("generateBtn");
        const btnText = document.getElementById("genBtnText");
        const loader = document.getElementById("complimentLoader");
        btn.disabled = true;
        btnText.textContent = "Generating...";
        loader.classList.add("active");

        fetch("/generate-compliment", { method: "POST" })
          .then((response) => response.text())
          .then((text) => {
            document.getElementById("message").value = text;
            btn.disabled = false;
            btnText.textContent = "Generate Compliment";
            loader.classList.remove("active");
          })
          .catch(() => {
            document.getElementById("message").value =
              "You do a wonderful job!";
            btn.disabled = false;
            btnText.textContent = "Generate Compliment";
            loader.classList.remove("active");
          });
      }
    </script>
  </body>
</html>
